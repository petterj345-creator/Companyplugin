# ─────────────────────────────────────────────
#  Companies — main configuration
# ─────────────────────────────────────────────

economy:
  # Cost to found a new company.
  creation-cost: 25000.0
  # Withdrawal tax (percentage of the withdrawn amount).
  withdraw-tax-percent: 10.0
  # Periodic earnings-tax tick. Tax is taken as a % of the company's earnings
  # (completed job rewards) since the last tick — NOT the whole balance.
  # Set to 0 to disable.
  earnings-tax-percent: 15.0
  # How often (in minutes) the earnings-tax tick runs. Default = 180 (3 hours).
  earnings-tax-interval-minutes: 180

company:
  # If balance drops below this value, the company is deleted.
  min-balance: -10000.0
  # Maximum workers (excluding the owner). -1 = unlimited.
  max-workers: 15
  # Max length of company names.
  max-name-length: 24

levels:
  # Max company level (level 1 = starting level).
  max-level: 50
  # Cost to go from level 1 -> 2.
  base-upgrade-cost: 50000.0
  # Each subsequent level's cost is multiplied by this factor.
  cost-growth: 1.35
  # Reward multiplier per level. Level N gets:
  #   1 + (N - 1) * reward-multiplier-per-level
  # So with 0.05: lvl 1 = 1.00x, lvl 5 = 1.20x, lvl 10 = 1.45x, lvl 20 = 1.95x.
  reward-multiplier-per-level: 0.05

jobs:
  # How often (in minutes) every active license rotates to a new job.
  rotation-minutes: 180   # 3 hours
  # Random reward multiplier range applied to each rolled job.
  reward-min-multiplier: 0.9
  reward-max-multiplier: 1.2
  # Random required-amount multiplier range.
  amount-min-multiplier: 0.8
  amount-max-multiplier: 1.2

payout:
  # How often (in minutes) the automatic payout to contributors runs.
  # Default 20 = 1 Minecraft day. Set higher/lower as you like.
  interval-minutes: 20
  # Minimum payout percentage an owner can set.
  min-percent: 10.0
  # Maximum payout percentage an owner can set.
  max-percent: 100.0
  # Default payout percentage for a new company.
  default-percent: 10.0

messages:
  prefix: "&8[&6Companies&8] &r"
